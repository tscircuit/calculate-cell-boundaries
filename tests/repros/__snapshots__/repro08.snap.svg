<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-17.5,-4.18 -4.436250000000001,-4.18" data-type="line" data-label="" points="39.99999999999997,228.74617737003058 222.62996941896023,228.74617737003058" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-8.40645,-20.759999999999998 -8.40645,-13.710227674999999" data-type="line" data-label="" points="167.12695500218436,460.5329838357361 167.12695500218436,361.97784429882046" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-8.40645,-13.710227674999999 4.63625,-13.710227674999999" data-type="line" data-label="" points="167.12695500218436,361.97784429882046 349.46264744429885,361.97784429882046" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-7.131250000000001,-5.579727674999999 -7.131250000000001,-4.600000000000001" data-type="line" data-label="" points="184.95412844036696,248.31423573612932 184.95412844036696,234.61773700305815" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-7.131250000000001,-4.600000000000001 -3.712900000000001,-4.600000000000001" data-type="line" data-label="" points="184.95412844036696,234.61773700305815 232.74233289646133,234.61773700305815" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-6.770000000000001,-4.18 -6.770000000000001,-0.6550000000000011" data-type="line" data-label="" points="190.00436871996504,228.74617737003058 190.00436871996504,179.4670161642639" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-4.436250000000001,-4.600000000000001 -4.436250000000001,-4.18" data-type="line" data-label="" points="222.62996941896023,234.61773700305815 222.62996941896023,228.74617737003058" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="-4.436249999999999,-5.579727675000001 -3.474999999999998,-5.579727675000001" data-type="line" data-label="" points="222.62996941896026,248.31423573612932 236.06815203145482,248.31423573612932" fill="none" stroke="#000" stroke-width="2.8"/></g><g><polyline data-points="4.63625,-20.759999999999998 4.63625,-0.6550000000000011" data-type="line" data-label="" points="349.46264744429885,460.5329838357361 349.46264744429885,179.4670161642639" fill="none" stroke="#000" stroke-width="2.8"/></g><g><rect data-type="rect" data-label="" data-x="-15.3" data-y="-3" x="39.99999999999997" y="202.46395806028835" width="61.511577107907385" height="19.571865443425082" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-10.747499999999999" data-y="-3" x="103.60856269113148" y="199.9475753604194" width="61.58147662734822" height="24.604630843162965" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-11.5075" data-y="-6.35" x="68.65880297072957" y="230.70336391437309" width="110.23154215814765" height="56.75840978593271" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-5.7475000000000005" data-y="-7" x="173.50808213193534" y="255.86719091306247" width="61.581476627348195" height="24.604630843162965" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-1.4262500000000002" data-y="-7.852500000000001" x="201.11839231105284" y="244.68326780253386" width="127.18217562254262" height="70.8082131935343" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-5.715" data-y="-5.615000000000002" x="191.0179117518567" y="237.6234163390127" width="27.470511140235914" height="22.36784622105722" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-3.6174999999999997" data-y="-5.54" x="218.94276976845782" y="235.45653123634776" width="30.26649191786811" height="24.604630843162965" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="-1.77245" data-y="-3.9472276749999997" x="232.74233289646133" y="210.22280471821756" width="54.25460899956312" height="30.538475840978606" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="0.7587499999999999" data-y="-10.692727675" x="266.3695937090433" y="300.6727828746177" width="57.77195281782434" height="38.24140288335525" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="14.35375" data-y="-7.132499999999999" x="370.6247269550022" y="179.46701616426387" width="229.3752730449978" height="181.10965487112279" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="-18.06" x="253.71778069025777" y="385.041502839668" width="61.86107470511138" height="75.4914809960681" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.07153124999999999"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":13.97990388816077,"c":0,"e":284.64831804281346,"b":0,"d":-13.97990388816077,"f":170.31017911751857};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>