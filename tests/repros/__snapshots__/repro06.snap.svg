<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-17.142500000000002,-14.260000000000002 2.530977674999999,-14.260000000000002" data-type="line" data-label="" points="39.99999999999994,357.85328861017945 361.3401632784017,357.85328861017945" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-11.088477674999998,-11.445 -11.088477674999998,-0.5" data-type="line" data-label="" points="138.88442473384868,311.87399737494536 138.88442473384868,133.10193962374214" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-11.088477674999998,-11.445 17.142499999999995,-11.445" data-type="line" data-label="" points="138.88442473384868,311.87399737494536 600,311.87399737494536" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-7.472500000000002,-23.384999999999998 -7.472500000000002,-14.260000000000002" data-type="line" data-label="" points="197.94662388799765,506.89806037625783 197.94662388799765,357.85328861017945" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-4.398477674999999,-11.445 -4.398477674999999,-0.5" data-type="line" data-label="" points="248.15670123960922,311.87399737494536 248.15670123960922,133.10193962374214" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-0.432500000000001,-23.384999999999998 -0.432500000000001,-14.260000000000002" data-type="line" data-label="" points="312.9356861601284,506.89806037625783 312.9356861601284,357.85328861017945" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="2.530977674999999,-14.260000000000002 2.530977674999999,-0.5" data-type="line" data-label="" points="361.3401632784017,357.85328861017945 361.3401632784017,133.10193962374214" fill="none" stroke="#000" stroke-width="2.