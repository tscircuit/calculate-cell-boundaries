9750619805" y="395.7065772203588" width="82.32171503572994" height="75.29823537990376" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.06122321428571427"/></g><g><rect data-type="rect" data-label="" data-x="9.62" data-y="-18.8825" x="442.46171795245743" y="390.84730931894416" width="69.33644450926062" height="85.01677118273301" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.06122321428571427"/></g><g><rect data-type="rect" data-label="" data-x="15.442499999999999" data-y="-18.8825" x="544.4655096981188" y="406.40513344028005" width="55.534490301881306" height="53.901122940061214" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.06122321428571427"/></g><g><rect data-type="rect" data-label="" data-x="3.032499999999999" data-y="-18.8825" x="329.26935977832875" y="359.8133294443635" width="80.52501093772787" height="147.08473093189434" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.06122321428571427"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":16.333673618200383,"c":0,"e":320.00000000000006,"b":0,"d":-16.333673618200383,"f":124.93510281464194};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>