 y="132.08695652173913" width="193.91304347826085" height="48.02173913043481" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="19" data-y="-23.802500000000002" x="367.391304347826" y="406" width="26.086956521739125" height="39.32608695652175" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="23" data-y="12" x="353.0434782608695" y="268.5869565217391" width="89.56521739130437" height="2.826086956521749" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="18.5" data-y="-6.5" x="352.3043478260869" y="325.1086956521739" width="51.913043478260875" height="50.6521739130435" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="19" data-y="29.5" x="347.5434782608695" y="181.6304347826087" width="65.78260869565219" height="24.565217391304373" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="57" data-y="-5" x="495.6521739130434" y="312.52173913043475" width="100.00000000000011" height="62.782608695652186" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="51" data-y="16" x="496.9565217391304" y="250.3478260869565" width="45.21739130434787" height="4.52173913043481" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="51.65" data-y="-31.697499999999998" x="484.78260869565213" y="412.0652173913043" width="75.21739130434787" height="95.84782608695656" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g><rect data-type="rect" data-label="" data-x="-25" data-y="-28.527500000000003" x="153.04347826086953" y="416.6521739130435" width="72.17391304347822" height="59.10869565217388" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.23"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":4.3478260869565215,"c":0,"e":297.8260869565217,"b":0,"d":-4.3478260869565215,"f":322.17391304347825};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
