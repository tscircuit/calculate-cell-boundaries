<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-59.3,-19.5275 8.217500000000001,-19.5275" data-type="line" data-label="" points="40,407.07608695652175 333.5543478260869,407.07608695652175" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="-59.3,18.500000000000007 69.50000000000001,18.500000000000007" data-type="line" data-label="" points="40,241.73913043478257 600,241.73913043478257" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="-59.3,29.597499999999997 2.6174999999999997,29.597499999999997" data-type="line" data-label="" points="40,193.48913043478262 309.2065217391304,193.48913043478262" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="-43.6325,-43.72 -43.6325,18.500000000000007" data-type="line" data-label="" points="108.11956521739125,512.2608695652174 108.11956521739125,241.73913043478257" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="-14.350000000000001,-19.5275 -14.350000000000001,18.500000000000007" data-type="line" data-label="" points="235.4347826086956,407.07608695652175 235.4347826086956,241.73913043478257" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="2.6174999999999997,18.500000000000007 2.6174999999999997,44.72" data-type="line" data-label="" points="309.2065217391304,241.73913043478257 309.2065217391304,127.73913043478262" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="8.217500000000001,-43.72 8.217500000000001,18.500000000000007" data-type="line" data-label="" points="333.5543478260869,512.2608695652174 333.5543478260869,241.73913043478257" fill="none" stroke="#000" stroke-width="2.756521739130435"/></g><g><polyline data-points="8.217500000000001,-16.447499999999998 69.50000000000001,-16.