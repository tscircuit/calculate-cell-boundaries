<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-16.24375,-10.582660699999995 16.15625,-10.582660699999995" data-type="line" data-label="" points="40,309.55540111111105 600,309.55540111111105" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-8.295,-10.582660699999995 -8.295,-0.5" data-type="line" data-label="" points="177.3858024691358,309.55540111111105 177.3858024691358,135.2871914814815" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="-2.5662499999999966,-21.873910699999996 -2.5662499999999966,-10.582660699999995" data-type="line" data-label="" points="276.40123456790127,504.7128085185185 276.40123456790127,309.55540111111105" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="5.150000000000002,-10.582660699999995 5.150000000000002,-0.5" data-type="line" data-label="" points="409.7685185185186,309.55540111111105 409.7685185185186,135.2871914814815" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><polyline data-points="12.787499999999998,-21.873910699999996 12.787499999999998,-10.582660699999995" data-type="line" data-label="" points="541.7746913580247,504.7128085185185 541.7746913580247,309.55540111111105" fill="none" stroke="#000" stroke-width="2.8000000000000003"/></g><g><rect data-type="rect" data-label="" data-x="-12.29" data-y="-4.961955349999998" x="56.570987654321016" y="165.30864197530863" width="103.53086419753083" height="94.19753086419755" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g><rect data-type="rect" data-label="" data-x="-1.5724999999999998" data-y="-4.961955349999998" x="194.66975308641975" y="175.56666666666666" width="197.81481481481484" height="73.68148148148151" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g><rect data-type="rect" data-label="" data-x="10.717500000000001" data-y="-4.9619553499999975" x="427.0524691358025" y="135.28719148148147" width="157.88888888888897" height="154.2404318518518" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g><rect data-type="rect" data-label="" data-x="-9.904999999999998" data-y="-16.648910699999995" x="40" y="374.56466037037035" width="219.11728395061732" height="79.67901234567898" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g><rect data-type="rect" data-label="" data-x="5.088749999999999" data-y="-16.648910699999995" x="293.6851851851852" y="329.5831788888888" width="230.0493827160493" height="169.64197530864197" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g><rect data-type="rect" data-label="" data-x="14.993749999999999" data-y="-16.648910699999995" x="559.8148148148148" y="324.0955245679012" width="40.18518518518522" height="180.61728395061732" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.05785714285714285"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":17.283950617283953,"c":0,"e":320.7561728395062,"b":0,"d":-17.283950617283953,"f":126.64521617283953};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>