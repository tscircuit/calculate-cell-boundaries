, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="20.174999999999997" data-y="23.789999999999996" x="204.45444319460069" y="261.1248593925759" width="34.195725534308195" height="34.555680539932496" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="12.619999999999997" data-y="23.789999999999996" x="120.67491563554555" y="262.02474690663666" width="65.78177727784029" height="32.75590551181102" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="58.985" data-y="23.789999999999996" x="550.5511811023623" y="255.72553430821148" width="40.49493813273341" height="45.354330708661394" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="1.6000000000000014" data-y="10.879999999999997" x="40" y="371.9685039370079" width="28.79640044994379" height="45.21934758155231" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="8.204999999999998" data-y="10.66" x="86.79415073115861" y="366.7491563554555" width="54.083239595050614" height="59.617547806524215" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="15.05" data-y="10.770000000000001" x="158.8751406074241" y="364.7919010123734" width="33.11586051743532" height="61.552305961754826" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="19.91" data-y="10.77" x="207.4690663667042" y="383.644544431946" width="23.397075365579326" height="23.84701912260971" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="26.865000000000002" data-y="10.880000000000003" x="248.86389201349837" y="372.14848143982" width="65.78177727784029" height="44.859392575927984" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="35.324999999999996" data-y="10.77" x="332.64341957255346" y="382.7896512935883" width="50.48368953880765" height="25.55680539932507" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="55.129999999999995" data-y="10.77" x="520.8098987626547" y="381.8897637795275" width="30.596175478065334" height="27.356580427446602" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="60.52999999999999" data-y="10.77" x="569.4038245219348" y="379.1901012373453" width="30.59617547806522" height="32.75590551181108" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="25.964999999999993" data-y="1.4200000000000017" x="256.55793025871765" y="466.9291338582677" width="34.19572553430817" height="25.55680539932513" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="31.264999999999993" data-y="1.4200000000000017" x="304.251968503937" y="466.9291338582677" width="34.195725534308224" height="25.55680539932513" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g><rect data-type="rect" data-label="" data-x="36.48499999999999" data-y="1.4200000000000017" x="352.84589426321713" y="466.9291338582677" width="30.956130483689492" height="25.55680539932513" fill="rgba(255, 165, 0, 0.4)" stroke="#c87000" stroke-width="0.11112499999999997"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":8.998875140607426,"c":0,"e":40,"b":0,"d":-8.998875140607426,"f":492.4859392575928};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>